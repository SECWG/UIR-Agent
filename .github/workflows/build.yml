name: Build and prepare release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs check "$RELEASE_TAG"
      - run: go mod verify
      - run: go vet ./...
      - run: node scripts/build.mjs --with-x86
      - uses: actions/upload-artifact@v4
        with:
          name: agent-standard
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/uir-agent-win-amd64.exe
            dist/uir-agent-win-arm64.exe
            dist/uir-agent-win-386.exe
            dist/uir-agent-linux-amd64
            dist/uir-agent-linux-arm64
            dist/uir-agent-linux-386
            dist/uir-agent-darwin-amd64
            dist/uir-agent-darwin-arm64
            dist/manifest.json

  windows-legacy:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs check "$env:RELEASE_TAG"
      - run: node scripts/build-legacy.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: agent-windows-legacy
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/windows-legacy/uir-agent-win-amd64-legacy.exe
            dist/windows-legacy/manifest.json

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'SECWG/UIR-Agent'
    needs: [standard, windows-legacy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: agent-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v4
        with:
          name: agent-standard
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: agent-windows-legacy
          path: dist/windows-legacy
      - name: Prepare release attachments
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs prepare "$RELEASE_TAG"
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/draft-release.mjs
